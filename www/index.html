    { q: "Quel est le moteur de recherche le plus utilisé au monde ?", options: ["Bing", "Yahoo", "Google", "DuckDuckGo"], bonne: 2 }
  ]
};

let categorieActuelle = "";
let questions = [];
let indexActuel = 0;
let score = 50;
let streak = 0;
let tempsRestant = 10;
let timerInterval = null;
let partieTerminee = false;
let indiceUtilise = false;

function melanger(tableau) {
  const copie = [...tableau];
  for (let i = copie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copie[i], copie[j]] = [copie[j], copie[i]];
  }
  return copie;
}

function jouerSon(bonneReponse) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = bonneReponse ? 880 : 220;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function totalVictoires() {
  let total = 0;
  Object.keys(banqueQuestions).forEach(cat => {
    total += parseInt(localStorage.getItem("victoires_" + cat) || 0);
  });
  return total;
}

function calculerGrade(total) {
  if (total >= 20) return "🏆 Maître du Quiz";
  if (total >= 10) return "🥇 Expert";
  if (total >= 5) return "🥈 Confirmé";
  if (total >= 1) return "🥉 Débutant motivé";
  return "🔰 Nouveau joueur";
}

function afficherGrade() {
  document.getElementById("gradeJoueur").innerText = calculerGrade(totalVictoires()) + " · " + totalVictoires() + " victoires au total";
}

function chargerCategories() {
  afficherGrade();
  const liste = document.getElementById("listeCategories");
  liste.innerHTML = "";
  Object.keys(banqueQuestions).forEach(cat => {
    const record = localStorage.getItem("victoires_" + cat) || 0;
    const div = document.createElement("div");
    div.className = "carte-cat";
    div.innerHTML = cat + '<div class="meilleur">Victoires : ' + record + '</div>';
    div.onclick = () => demarrerQuiz(cat);
    liste.appendChild(div);
  });
}

function demarrerQuiz(cat) {
  categorieActuelle = cat;
  questions = melanger(banqueQuestions[cat]);
  indexActuel = 0;
  score = 50;
  streak = 0;
  partieTerminee = false;
  document.getElementById("ecranCategories").style.display = "none";
  document.getElementById("resultat").style.display = "none";
  document.getElementById("jeu").style.display = "block";
  chargerQuestion();
}

function mettreAJourScoreVisuel() {
  document.getElementById("scoreBarre").style.width = score + "%";
  document.getElementById("scoreTexte").innerText = "Score : " + score + " / 100";
  if (streak >= 2) {
    document.getElementById("streakTexte").innerText = "🔥 Série de " + streak + " bonnes réponses !";
  } else {
    document.getElementById("streakTexte").innerText = "";
  }
}

function chargerQuestion() {
  if (partieTerminee) return;
  if (indexActuel >= questions.length) {
    afficherResultat(score >= 50);
    return;
  }
  tempsRestant = 10;
  indiceUtilise = false;
  document.getElementById("boutonIndice").style.display = "inline-block";
  const q = questions[indexActuel];
  document.getElementById("progression").innerText = "Question " + (indexActuel + 1);
  document.getElementById("question").innerText = q.q;
  mettreAJourScoreVisuel();
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = opt;
    btn.dataset.index = i;
    btn.onclick = () => verifier(i, btn);
    optionsDiv.appendChild(btn);
  });
  demarrerTimer();
}

function utiliserIndice() {
  if (indiceUtilise || partieTerminee) return;
  indiceUtilise = true;
  document.getElementById("boutonIndice").style.display = "none";
  score = Math.max(0, score - 5);
  mettreAJourScoreVisuel();
  const q = questions[indexActuel];
  const boutons = document.querySelectorAll(".option");
  let masques = 0;
  boutons.forEach((b, i) => {
    if (i !== q.bonne && masques < 2) {
      b.classList.add("masquee");
      masques++;
    }
  });
}

function demarrerTimer() {
  clearInterval(timerInterval);
  document.getElementById("timerBarre").style.width = "100%";
  timerInterval = setInterval(() => {
    tempsRestant -= 0.1;
    const pourcentage = Math.max(0, (tempsRestant / 10) * 100);
    document.getElementById("timerBarre").style.width = pourcentage + "%";
    if (tempsRestant <= 0) {
      clearInterval(timerInterval);
      tempsEcoule();
    }
  }, 100);
}

function appliquerResultat(correct) {
  if (correct) {
    streak++;
    const bonus = streak >= 3 ? 15 : 10;
    score = Math.min(100, score + bonus);
  } else {
    streak = 0;
    score = Math.max(0, score - 10);
  }
  mettreAJourScoreVisuel();
  if (score >= 100) {
    setTimeout(() => afficherResultat(true), 800);
    return true;
  }
  if (score <= 0) {
    setTimeout(() => afficherResultat(false), 800);
    return true;
  }
  return false;
}

function tempsEcoule() {
  const q = questions[indexActuel];
  const boutons = document.querySelectorAll(".option");
  boutons.forEach(b => b.onclick = null);
  boutons[q.bonne].classList.add("correcte");
  jouerSon(false);
  const fini = appliquerResultat(false);
  if (fini) { partieTerminee = true; return; }
  setTimeout(() => {
    indexActuel++;
    chargerQuestion();
  }, 1200);
}

function verifier(choix, btn) {
  clearInterval(timerInterval);
  const q = questions[indexActuel];
  const boutons = document.querySelectorAll(".option");
  boutons.forEach(b => b.onclick = null);
  const correct = choix === q.bonne;
  if (correct) {
    btn.classList.add("correcte");
    jouerSon(true);
  } else {
    btn.classList.add("incorrecte");
    boutons[q.bonne].classList.add("correcte");
    jouerSon(false);
  }
  const fini = appliquerResultat(correct);
  if (fini) { partieTerminee = true; return; }
  setTimeout(() => {
    indexActuel++;
    chargerQuestion();
  }, 1000);
}

function afficherResultat(victoire) {
  partieTerminee = true;
  document.getElementById("jeu").style.display = "none";
  document.getElementById("resultat").style.display = "block";
  const scoreFinalDiv = document.getElementById("scoreFinal");
  scoreFinalDiv.classList.remove("anim-victoire", "anim-defaite");
  void scoreFinalDiv.offsetWidth;

  if (victoire) {
    scoreFinalDiv.innerHTML = '🏆 <span class="gagne">Tu as gagné !</span>';
    scoreFinalDiv.classList.add("anim-victoire");
    const victoires = parseInt(localStorage.getItem("victoires_" + categorieActuelle) || 0) + 1;
    localStorage.setItem("victoires_" + categorieActuelle, victoires);
    document.getElementById("recordAffiche").innerText = "Total victoires : " + victoires;
  } else {
    scoreFinalDiv.innerHTML = '💀 <span class="perdu">Tu as perdu !</span>';
    scoreFinalDiv.classList.add("anim-defaite");
    document.getElementById("recordAffiche").innerText = "Score final : " + score + " / 100";
  }
}

function partagerScore() {
  const texte = "J'ai joué à Bien gbé (" + categorieActuelle + ") et j'ai fini avec " + score + "/100 points ! 🎯";
  if (navigator.share) {
    navigator.share({ text: texte });
  } else {
    alert(texte);
  }
}

function retourCategories() {
  document.getElementById("resultat").style.display = "none";
  document.getElementById("ecranCategories").style.display = "block";
  chargerCategories();
}

chargerCategories();
</script>
</body>
</html>
